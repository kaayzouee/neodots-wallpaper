name: Generate wallpaper manifest

on:
  push:
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.gif"
      - "*.webp"
      - "tools/generate-manifest.py"
      - ".github/workflows/generate-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-wallpaper-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Generate manifest
        run: python3 tools/generate-manifest.py

      - name: Commit manifest
        run: |
          git add manifest.tsv

          if git diff --cached --quiet -- manifest.tsv; then
            echo "Manifest is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(manifest): refresh wallpaper manifest"
          git push
